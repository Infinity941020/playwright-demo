name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  ui-tests:
    name: UI Tests (TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Restore Playwright Browser Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run UI Tests
        run: npx playwright test tests/ui

      - name: Upload UI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7

  api-tests:
    name: API Tests (TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Restore Playwright Browser Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run API Tests
        run: npx playwright test tests/api

      - name: Upload API Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7

  visual-tests:
    name: Visual Tests (TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Restore Playwright Browser Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Visual Tests
        run: npx playwright test tests/visual

      - name: Upload Visual Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            playwright-report
            test-results
            tests/visual/__snapshots__
          retention-days: 7

  python-ui-tests:
    name: UI Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Restore Playwright Browser Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-python-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: python
        run: python -m playwright install --with-deps chromium

      - name: Run UI Tests
        working-directory: python
        run: pytest tests/ui --tracing retain-on-failure --screenshot only-on-failure

      - name: Upload UI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ui-artifacts
          path: python/test-results
          retention-days: 7
          if-no-files-found: ignore

  python-api-tests:
    name: API Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Restore Playwright Browser Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-python-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: python
        run: python -m playwright install --with-deps chromium

      - name: Run API Tests
        working-directory: python
        run: pytest tests/api

      - name: Upload API Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-api-artifacts
          path: python/test-results
          retention-days: 7
          if-no-files-found: ignore

  python-visual-tests:
    name: Visual Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Restore Playwright Browser Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-python-${{ runner.os }}-${{ hashFiles('python/requirements.txt') }}

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        working-directory: python
        run: python -m playwright install --with-deps chromium

      - name: Run Visual Tests
        working-directory: python
        run: pytest tests/visual -m visual

      - name: Upload Visual Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-visual-artifacts
          path: python/test-results
          retention-days: 7
          if-no-files-found: ignore

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest

    needs:
      - ui-tests
      - api-tests
      - visual-tests
      - python-ui-tests
      - python-api-tests
      - python-visual-tests

    if: always()

    steps:
      - name: Send Slack Notification
        run: |
          if [[ "${{ needs.ui-tests.result }}" == "failure" || \
                "${{ needs.api-tests.result }}" == "failure" || \
                "${{ needs.visual-tests.result }}" == "failure" || \
                "${{ needs.python-ui-tests.result }}" == "failure" || \
                "${{ needs.python-api-tests.result }}" == "failure" || \
                "${{ needs.python-visual-tests.result }}" == "failure" ]]; then
            STATUS="❌ Playwright CI Failed"
          else
            STATUS="✅ Playwright CI Success"
          fi

          cat > payload.json <<EOF
          {
            "text": "${STATUS}\n\nRepository: ${{ github.repository }}\n\nBranch: ${{ github.ref_name }}\n\nTriggered By: ${{ github.actor }}\n\nResults:\nUI Tests (TS): ${{ needs.ui-tests.result }}\nAPI Tests (TS): ${{ needs.api-tests.result }}\nVisual Tests (TS): ${{ needs.visual-tests.result }}\nUI Tests (Python): ${{ needs.python-ui-tests.result }}\nAPI Tests (Python): ${{ needs.python-api-tests.result }}\nVisual Tests (Python): ${{ needs.python-visual-tests.result }}\n\nWorkflow:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

          curl -X POST \
            -H "Content-type: application/json" \
            --data @payload.json \
            ${{ secrets.SLACK_WEBHOOK_URL }}