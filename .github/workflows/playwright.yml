name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  ui-tests:
    name: UI Tests (TS)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Run UI Tests
        working-directory: typescript
        run: npx playwright test tests/ui

      - name: Upload UI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: |
            typescript/playwright-report
            typescript/test-results
          retention-days: 7

  api-tests:
    name: API Tests (TS)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Run API Tests
        working-directory: typescript
        run: npx playwright test tests/api

      - name: Upload API Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          path: |
            typescript/playwright-report
            typescript/test-results
          retention-days: 7

  visual-tests:
    name: Visual Tests (TS)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      - name: Run Visual Tests
        working-directory: typescript
        run: npx playwright test tests/visual

      - name: Upload Visual Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            typescript/playwright-report
            typescript/test-results
            typescript/tests/visual/__snapshots__
          retention-days: 7

  python-ui-tests:
    name: UI Tests (Python)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-python が使う lsb_release がイメージに入っていないため入れる
      - name: Install lsb_release
        run: apt-get update && apt-get install -y --no-install-recommends lsb-release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Run UI Tests
        working-directory: python
        run: pytest tests/ui --tracing retain-on-failure --screenshot only-on-failure

      - name: Upload UI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ui-artifacts
          path: python/test-results
          retention-days: 7
          if-no-files-found: ignore

  python-api-tests:
    name: API Tests (Python)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-python が使う lsb_release がイメージに入っていないため入れる
      - name: Install lsb_release
        run: apt-get update && apt-get install -y --no-install-recommends lsb-release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Run API Tests
        working-directory: python
        run: pytest tests/api

      - name: Upload API Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-api-artifacts
          path: python/test-results
          retention-days: 7
          if-no-files-found: ignore

  python-visual-tests:
    name: Visual Tests (Python)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-python が使う lsb_release がイメージに入っていないため入れる
      - name: Install lsb_release
        run: apt-get update && apt-get install -y --no-install-recommends lsb-release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Run Visual Tests
        working-directory: python
        run: pytest tests/visual -m visual

      - name: Upload Visual Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-visual-artifacts
          path: python/test-results
          retention-days: 7
          if-no-files-found: ignore

  notify:
    name: Slack Notification
    runs-on: ubuntu-24.04

    needs:
      - ui-tests
      - api-tests
      - visual-tests
      - python-ui-tests
      - python-api-tests
      - python-visual-tests

    if: always()

    # 所要時間を求めるために、この実行とジョブの一覧を GitHub の API から読む
    permissions:
      actions: read

    steps:
      - name: Send Slack Notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ needs.ui-tests.result }}" == "failure" || \
                "${{ needs.api-tests.result }}" == "failure" || \
                "${{ needs.visual-tests.result }}" == "failure" || \
                "${{ needs.python-ui-tests.result }}" == "failure" || \
                "${{ needs.python-api-tests.result }}" == "failure" || \
                "${{ needs.python-visual-tests.result }}" == "failure" ]]; then
            STATUS="❌ Playwright CI Failed"
          else
            STATUS="✅ Playwright CI Success"
          fi

          # 秒数を「4m 12s」の形にする
          format_duration() {
            local total=$1
            if (( total >= 60 )); then
              echo "$((total / 60))m $((total % 60))s"
            else
              echo "${total}s"
            fi
          }

          # 所要時間が取れなかった場合でも通知は送り、時間の部分だけ unknown にする
          RUN_API="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # CI 全体：この実行が始まった時刻から、notify のジョブが動いた今の時刻まで
          DURATION="unknown"
          RUN_STARTED_AT=$(gh api "${RUN_API}" --jq '.run_started_at' 2>/dev/null || true)
          START_EPOCH=$(date -d "${RUN_STARTED_AT}" +%s 2>/dev/null || true)
          if [[ -n "${RUN_STARTED_AT}" && "${START_EPOCH}" =~ ^[0-9]+$ ]]; then
            DURATION=$(format_duration $(( $(date +%s) - START_EPOCH )))
          fi

          # ジョブごと：この実行（今回の試行）のジョブの開始・終了の時刻から求める
          JOBS_JSON=$(gh api "${RUN_API}/attempts/${{ github.run_attempt }}/jobs?per_page=100" 2>/dev/null || true)

          job_duration() {
            local seconds
            seconds=$(jq -r --arg name "$1" \
              '.jobs[] | select(.name == $name and .started_at != null and .completed_at != null)
                | (.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)' \
              <<< "${JOBS_JSON}" 2>/dev/null | head -n 1 || true)
            if [[ "${seconds}" =~ ^[0-9]+$ ]]; then
              format_duration "${seconds}"
            else
              echo "unknown"
            fi
          }

          UI_TS_TIME=$(job_duration "UI Tests (TS)")
          API_TS_TIME=$(job_duration "API Tests (TS)")
          VISUAL_TS_TIME=$(job_duration "Visual Tests (TS)")
          UI_PY_TIME=$(job_duration "UI Tests (Python)")
          API_PY_TIME=$(job_duration "API Tests (Python)")
          VISUAL_PY_TIME=$(job_duration "Visual Tests (Python)")

          cat > payload.json <<EOF
          {
            "text": "${STATUS}\n\nRepository: ${{ github.repository }}\n\nBranch: ${{ github.head_ref || github.ref_name }}\n\nTriggered By: ${{ github.actor }}\n\nDuration: ${DURATION}\n\nResults:\nUI Tests (TS): ${{ needs.ui-tests.result }} (${UI_TS_TIME})\nAPI Tests (TS): ${{ needs.api-tests.result }} (${API_TS_TIME})\nVisual Tests (TS): ${{ needs.visual-tests.result }} (${VISUAL_TS_TIME})\nUI Tests (Python): ${{ needs.python-ui-tests.result }} (${UI_PY_TIME})\nAPI Tests (Python): ${{ needs.python-api-tests.result }} (${API_PY_TIME})\nVisual Tests (Python): ${{ needs.python-visual-tests.result }} (${VISUAL_PY_TIME})\n\nWorkflow:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

          curl -X POST \
            -H "Content-type: application/json" \
            --data @payload.json \
            ${{ secrets.SLACK_WEBHOOK_URL }}